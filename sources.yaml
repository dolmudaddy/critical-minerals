# Critical Minerals News - Source Configuration
# 신뢰도 가중치(tier_weight): Tier 1=5, Tier 2=3, Tier 3=1

# Tier 1: 정부·국제기구 (가장 신뢰도 높음)
tier1_government:
  - name: "USGS Mineral Resources"
    url: "https://www.usgs.gov/programs/mineral-resources-program/news/feed"
    type: "rss"
    tier_weight: 5

  - name: "IEA News"
    url: "https://www.iea.org/rss/news"
    type: "rss"
    tier_weight: 5

  - name: "European Commission - Energy"
    url: "https://ec.europa.eu/commission/presscorner/api/rss?language=en&service=press&topic=energy"
    type: "rss"
    tier_weight: 5

  - name: "Geoscience Australia"
    url: "https://www.ga.gov.au/news-events/news/feed"
    type: "rss"
    tier_weight: 5

# Tier 2: 학술·산업 전문 매체
tier2_industry:
  - name: "Mining.com"
    url: "https://www.mining.com/feed/"
    type: "rss"
    tier_weight: 3
    
  - name: "S&P Global - Metals & Mining"
    url: "https://www.spglobal.com/commodityinsights/en/market-insights/rss-feed"
    type: "rss"
    tier_weight: 4

  - name: "Wood Mackenzie - via Google News"
    url: 'https://news.google.com/rss/search?q=site:woodmac.com+(critical+minerals+OR+lithium+OR+cobalt+OR+nickel+OR+rare+earth)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 4

  - name: "McKinsey - via Google News"
    url: 'https://news.google.com/rss/search?q=site:mckinsey.com+(critical+minerals+OR+mining+OR+metals)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 4

  - name: "Deloitte - via Google News"
    url: 'https://news.google.com/rss/search?q=site:deloitte.com+(critical+minerals+OR+mining+OR+%22energy+transition%22)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 4

  - name: "BCG - via Google News"
    url: 'https://news.google.com/rss/search?q=site:bcg.com+(critical+minerals+OR+mining+OR+battery+materials)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 4
    
  - name: "Reuters Commodities"
    url: "https://www.reutersagency.com/feed/?best-topics=commodities&post_type=best"
    type: "rss"
    tier_weight: 3
    
  - name: "Fastmarkets - via Google News"
    url: 'https://news.google.com/rss/search?q=site:fastmarkets.com+(lithium+OR+cobalt+OR+nickel+OR+%22rare+earth%22+OR+graphite+OR+tungsten)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 5

  - name: "Benchmark Mineral Intelligence - via Google News"
    url: 'https://news.google.com/rss/search?q=site:benchmarkminerals.com+OR+site:source.benchmarkminerals.com&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 5

  - name: "Project Blue - via Google News"
    url: 'https://news.google.com/rss/search?q=site:projectblue.com+(critical+OR+rare+earth+OR+lithium+OR+cobalt+OR+vanadium+OR+graphite)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 5

  - name: "Project Blue Mentions in Industry News"
    url: 'https://news.google.com/rss/search?q=%22Project+Blue%22+(critical+minerals+OR+rare+earth+OR+lithium+OR+cobalt)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 4

  - name: "arXiv Geophysics"
    url: "http://export.arxiv.org/rss/physics.geo-ph"
    type: "rss"
    tier_weight: 4

  - name: "Mining Weekly"
    url: "https://www.miningweekly.com/page/rss-feeds"
    type: "rss"
    tier_weight: 3

# Tier 3: Google News 검색 RSS (광범위 모니터링)
tier3_search:
  - name: "Google News - Critical Minerals Exploration"
    url: 'https://news.google.com/rss/search?q=%22critical+minerals%22+exploration+when:7d&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 1

  - name: "Google News - Lithium Discovery"
    url: 'https://news.google.com/rss/search?q=lithium+(discovery+OR+deposit+OR+resource)+when:7d&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 1

  - name: "Google News - Rare Earth Elements"
    url: 'https://news.google.com/rss/search?q=%22rare+earth%22+(deposit+OR+exploration+OR+mining)+when:7d&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 1

  - name: "Google News - IRA CRMA Policy"
    url: 'https://news.google.com/rss/search?q=(IRA+OR+CRMA+OR+%22critical+raw+materials%22)+supply+chain+when:7d&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 1

# 점수화 키워드
keywords:
  # 핵심 광종 (이 중 하나는 반드시 포함되어야 함)
  critical_minerals:
  # 배터리·에너지 전환
  - lithium
  - cobalt
  - nickel
  - graphite
  - manganese
  
  # 영구자석·고기능
  - rare earth
  - REE
  
  # 반도체·전자
  - gallium
  - germanium
  - indium       # 추가 권장
  - tellurium    # 추가 권장
  
  # 군수·고온
  - tungsten
  - vanadium
  - antimony     # 추가 권장 (최근 중국 수출통제 핵심)
  - platinum group
  
  # 일반
  - critical mineral
  - critical raw material
  - strategic mineral   # 추가 권장

  # 탐사 기술 (가중치)
  exploration_tech:
    geophysical: 4
    magnetotelluric: 5
    "MT survey": 5
    seismic: 3
    gravity: 3
    magnetic: 3
    "remote sensing": 4
    hyperspectral: 5
    satellite: 2
    drilling: 3
    "machine learning": 3
    "AI exploration": 4
    geochemistry: 3
    exploration: 2

  # 정책·시장 (가중치)
  policy_market:
    IRA: 4
    CRMA: 4
    "supply chain": 3
    "export restriction": 4
    tariff: 2
    ODA: 3
    Tanzania: 3   # 박사님 ODA 프로젝트
    "value chain": 3
    refining: 2
    smelting: 2
    processing: 2
    "price floor": 4            # ← 추가 (최근 미국 정책 핵심 용어)
  stockpile: 3                # ← 추가 (전략비축)
  "trade bloc": 3             # ← 추가 (Critical Minerals Ministerial 핵심)

# 카드뉴스 발행 설정
publication:
  max_cards_per_week: 12
  min_score_threshold: 8
  dedup_similarity_threshold: 0.7
