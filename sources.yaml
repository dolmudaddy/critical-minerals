# Critical Minerals News - Source Configuration
# 신뢰도 가중치(tier_weight): Tier 1=5, Tier 2=3, Tier 3=1

tier1_government:
  # USGS - 검증된 공식 RSS (Mineral Industry Surveys + Yearbook 발행)
  - name: "USGS Minerals Periodicals"
    url: "https://minerals.usgs.gov/rss/mineral-commodity-periodicals.rss"
    type: "rss"
    tier_weight: 5

  # IEA - Google News 우회 (자체 RSS는 봇 차단)
  - name: "IEA - via Google News"
    url: 'https://news.google.com/rss/search?q=site:iea.org+(critical+minerals+OR+%22energy+transition%22+OR+lithium+OR+cobalt+OR+%22rare+earth%22)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 5

  # European Commission - 박사님 시스템에서 정상 동작 중 (그대로 유지)
  - name: "European Commission - Energy"
    url: "https://ec.europa.eu/commission/presscorner/api/rss?language=en&service=press&topic=energy"
    type: "rss"
    tier_weight: 5

  # Geoscience Australia - Google News 우회 (자체 RSS는 URL 변경됨)
  - name: "Geoscience Australia - via Google News"
    url: 'https://news.google.com/rss/search?q=site:ga.gov.au+(mineral+OR+critical+OR+exploration+OR+resource)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 5

  # 보너스: BGS (영국 지질조사소) - 박사님 분야 권위
  - name: "BGS - via Google News"
    url: 'https://news.google.com/rss/search?q=site:bgs.ac.uk+(critical+minerals+OR+lithium+OR+cobalt+OR+%22rare+earth%22)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 5

  # 보너스: NRCan (캐나다 자연자원부) - 핵심광물 정책 선도국
  - name: "NRCan - via Google News"
    url: 'https://news.google.com/rss/search?q=site:nrcan-rncan.gc.ca+(critical+minerals+OR+%22minerals+strategy%22)&hl=en&gl=US&ceid=US:en'
    type: "rss"
    tier_weight: 5

