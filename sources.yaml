# 점수화 키워드
keywords:
  # 핵심 광종 (이 중 하나는 반드시 포함되어야 함)
  critical_minerals:
  # 배터리·에너지 전환
  - lithium
  - cobalt
  - nickel
  - graphite
  - manganese
  
  # 영구자석·고기능
  - rare earth
  - REE
  
  # 반도체·전자
  - gallium
  - germanium
  - indium       # 추가 권장
  - tellurium    # 추가 권장
  
  # 군수·고온
  - tungsten
  - vanadium
  - antimony     # 추가 권장 (최근 중국 수출통제 핵심)
  - platinum group
  
  # 일반
  - critical mineral
  - critical raw material
  - strategic mineral   # 추가 권장

  # 탐사 기술 (가중치)
  exploration_tech:
    geophysical: 4
    magnetotelluric: 5
    "MT survey": 5
    seismic: 3
    gravity: 3
    magnetic: 3
    "remote sensing": 4
    hyperspectral: 5
    satellite: 2
    drilling: 3
    "machine learning": 3
    "AI exploration": 4
    geochemistry: 3
    exploration: 2

  # 정책·시장 (가중치)
  policy_market:
    IRA: 4
    CRMA: 4
    "supply chain": 3
    "export restriction": 4
    tariff: 2
    ODA: 3
    Tanzania: 3   # 박사님 ODA 프로젝트
    "value chain": 3
    refining: 2
    smelting: 2
    processing: 2
    "price floor": 4            # ← 추가 (최근 미국 정책 핵심 용어)
  stockpile: 3                # ← 추가 (전략비축)
  "trade bloc": 3             # ← 추가 (Critical Minerals Ministerial 핵심)

# 카드뉴스 발행 설정
publication:
  max_cards_per_week: 12
  min_score_threshold: 5
  dedup_similarity_threshold: 0.7
