name: Weekly Critical Minerals Digest

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pyyaml anthropic

      - name: Collect articles
        run: python scripts/collect.py

      - name: Summarize with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize.py

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Build archive index
        run: python scripts/build_index.py

      - name: Send to Mailchimp
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python scripts/send_email.py
        continue-on-error: true

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ rss.xml          # ← rss.xml 추가
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly digest: $(date -u +'%Y-%m-%d')"
            git push
          fi
